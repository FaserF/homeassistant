- id: open_covers_when_sunrise
  alias: "Open all covers when sun rise"
  trigger:
    - platform: sun
      event: sunrise
    - platform: time
      at: "08:00:00"
    - platform: time
      at: "11:00:00"
  condition:
    condition: and
    conditions:
      - condition: state
        entity_id: input_boolean.gast_modus
        state: "off"
      # - condition: or
      #  conditions:
      #    - condition: state
      #      entity_id: person.fabian
      #      state: home
      #    - condition: state
      #      entity_id: person.samuel
      #      state: home
      - condition: or
        conditions:
          - condition: and
            conditions:
              - condition: state
                entity_id: binary_sensor.workday_sensor
                state: "off"
              - condition: time
                after: "10:00:00"
                before: "16:30:00"
          - condition: and
            conditions:
              - condition: state
                entity_id: binary_sensor.workday_sensor
                state: "on"
              - condition: time
                after: "07:30:00"
                before: "16:30:00"
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.abwesend_modus
              state: "on"
          sequence:
            - service: cover.set_cover_position
              target:
                entity_id: all
              data:
                position: 30
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.abwesend_modus
              state: "off"
            - condition: state
              entity_id: device_tracker.steckerleiste_bett
              state: "home"
            - condition: not
              conditions:
                - condition: state
                  entity_id: cover.schlafzimmer_gross
                  state: "open"
          sequence:
            - choose:
                - conditions:
                    - condition: numeric_state
                      entity_id: sensor.weather_ebersberg_hourly
                      above: 22
                    - condition: or
                      conditions:
                        - condition: template
                          value_template: "{{state_attr('sensor.weather_ebersberg_hourly', 'forecast')[0]['condition'] == 'sunny' }}"
                        - condition: template
                          value_template: "{{state_attr('sensor.weather_ebersberg_hourly', 'forecast')[0]['condition'] == 'partlycloudy' }}"
                  sequence:
                    - service: cover.set_cover_position
                      target:
                        entity_id:
                          - cover.schlafzimmer_gross
                      data:
                        position: 60
              default:
                - service: cover.set_cover_position
                  target:
                    entity_id: cover.schlafzimmer_gross
                  data:
                    position: 30
                - delay: "00:03:00"
                - service: cover.open_cover
                  target:
                    entity_id: cover.schlafzimmer_gross
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.abwesend_modus
              state: "off"
            - condition: state
              entity_id: input_boolean.gast_modus
              state: "off"
          sequence:
            - choose:
                - conditions:
                    - condition: numeric_state
                      entity_id: sensor.weather_ebersberg_hourly
                      above: 22
                    - condition: or
                      conditions:
                        - condition: template
                          value_template: "{{state_attr('sensor.weather_ebersberg_hourly', 'forecast')[0]['condition'] == 'sunny' }}"
                        - condition: template
                          value_template: "{{state_attr('sensor.weather_ebersberg_hourly', 'forecast')[0]['condition'] == 'partlycloudy' }}"
                  sequence:
                    - service: cover.set_cover_position
                      target:
                        entity_id:
                          - cover.wohnzimmer_links
                          - cover.wohnzimmer_rechts
                      data:
                        position: 60
              default:
                - service: cover.open_cover
                  target:
                    entity_id:
                      - cover.wohnzimmer_links
                      - cover.wohnzimmer_rechts
    - service: light.turn_off
      entity_id: all

- id: lower_covers_when_sunset
  alias: "lower all covers when sun set"
  trigger:
    platform: sun
    event: sunset
    offset: "00:15:00"
  action:
    - service: switch.turn_on
      data:
        entity_id: switch.schlafzimmer_steckerleiste_bett_bett_usb_ports
    - parallel:
        - choose:
            - conditions:
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: cover.wohnzimmer_links
                      state: "closed"
                    - condition: state
                      entity_id: cover.wohnzimmer_rechts
                      state: "closed"
              sequence:
                - choose:
                    - conditions:
                        - condition: state
                          entity_id: binary_sensor.wohnzimmer_fernseher_leds_connectivity
                          state: "on"
                      sequence:
                        - delay: "00:15:00"
                - service: cover.set_cover_position
                  target:
                    entity_id:
                      - cover.wohnzimmer_links
                      - cover.wohnzimmer_rechts
                  data:
                    position: 23
        - choose:
            - conditions:
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: cover.schlafzimmer_gross
                      state: "closed"
              sequence:
                - choose:
                    - conditions:
                        - condition: state
                          entity_id: binary_sensor.wohnzimmer_fernseher_leds_connectivity
                          state: "on"
                      sequence:
                        - delay: "00:15:00"
                - choose:
                    - conditions:
                        - condition: numeric_state
                          entity_id: sensor.weather_ebersberg_hourly
                          attribute: temperature
                          above: 20
                      sequence:
                        - service: cover.set_cover_position
                          target:
                            entity_id: cover.schlafzimmer_gross
                          data:
                            position: 45
                  default:
                    - service: cover.set_cover_position
                      target:
                        entity_id: cover.schlafzimmer_gross
                      data:
                        position: 33

- id: lower_covers_when_hot_outside
  alias: "lower covers when hot outside"
  trigger:
    - platform: numeric_state
      entity_id: sensor.weather_ebersberg_hourly
      above: 23
  condition:
    condition: and
    conditions:
      - condition: time
        after: "11:30:00"
        before: "17:30:00"
      - condition: state
        entity_id: input_boolean.abwesend_modus
        state: "off"
      - condition: or
        conditions:
          - condition: template
            value_template: "{{state_attr('sensor.weather_ebersberg_hourly', 'forecast')[0]['condition'] == 'sunny' }}"
          - condition: template
            value_template: "{{state_attr('sensor.weather_ebersberg_hourly', 'forecast')[0]['condition'] == 'partlycloudy' }}"
  action:
    - choose:
        - conditions:
            - condition: or
              conditions:
                - condition: state
                  entity_id: person.fabian
                  state: "home"
                - condition: state
                  entity_id: person.samuel
                  state: "home"
          sequence:
            - choose:
                - conditions:
                    - condition: state
                      entity_id: input_boolean.fabian_pc_strom
                      state: "on"
                  sequence:
                    - service: cover.set_cover_position
                      target:
                        entity_id: cover.schlafzimmer_gross
                      data:
                        position: 80
              default:
                - service: cover.set_cover_position
                  target:
                    entity_id:
                      - cover.wohnzimmer_links
                      - cover.wohnzimmer_rechts
                      - cover.schlafzimmer_gross
                  data:
                    position: 60
      default:
        - service: cover.set_cover_position
          target:
            entity_id: all
          data:
            position: 25

- id: close_all_covers_when_sun_set
  alias: "Close all covers at evening"
  trigger:
    - platform: time
      at: "21:50:00"
    - platform: template
      value_template: "{{ as_timestamp(now()) | round(-2) == (as_timestamp(states.automation.lower_all_covers_when_sun_set.attributes.last_triggered) + 2700) | round(-2) }}"
  condition:
    - condition: template
      value_template: "{{ as_timestamp(now()) - as_timestamp(states.automation.lower_all_covers_when_sun_set.attributes.last_triggered) | int > 3200 }}"
  action:
    - parallel:
        - choose:
            - conditions:
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: cover.wohnzimmer_links
                      state: "closed"
                    - condition: state
                      entity_id: cover.wohnzimmer_rechts
                      state: "closed"
              sequence:
                - choose:
                    - conditions:
                        - condition: state
                          entity_id: device_tracker.steckerleiste_tv
                          state: "home"
                        - condition: state
                          entity_id: switch.fernseher
                          state: "on"
                      sequence:
                        - service: light.turn_on
                          data:
                            entity_id:
                              - light.fernseher_leds
                              - light.fernseher_leds
                              - light.stehlampe
                            transition: 2
                - choose:
                    - conditions:
                        - condition: state
                          entity_id: binary_sensor.wohnzimmer_fernseher_leds_connectivity
                          state: "on"
                      sequence:
                        - delay: "00:15:00"
                - service: cover.close_cover
                  target:
                    entity_id:
                      - cover.wohnzimmer_links
                      - cover.wohnzimmer_rechts
        - choose:
            - conditions:
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: cover.schlafzimmer_gross
                      state: "closed"
              sequence:
                - choose:
                    - conditions:
                        - condition: state
                          entity_id: device_tracker.steckerleiste_schreibtisch
                          state: home
                      sequence:
                        - service: light.turn_on
                          data:
                            entity_id:
                              - light.stehlampe_esstisch
                              - light.yeelink_bslamp2_22e2_light
                            transition: 2
                        - service: light.turn_on
                          data:
                            entity_id:
                              - light.stehlampe
                - choose:
                    - conditions:
                        - condition: state
                          entity_id: binary_sensor.wohnzimmer_fernseher_leds_connectivity
                          state: "on"
                      sequence:
                        - delay: "00:15:00"
                - choose:
                    - conditions:
                        - condition: numeric_state
                          entity_id: sensor.weather_ebersberg_hourly
                          above: 20
                        - condition: state
                          entity_id: binary_sensor.workday_sensor
                          state: "on"
                      sequence:
                        - service: cover.set_cover_position
                          target:
                            entity_id: cover.schlafzimmer_gross
                          data:
                            position: 33
                    - conditions:
                        - condition: state
                          entity_id: binary_sensor.workday_sensor
                          state: "off"
                      sequence:
                        - service: cover.close_cover
                          target:
                            entity_id: cover.schlafzimmer_gross
                  default:
                    - service: cover.set_cover_position
                      target:
                        entity_id: cover.schlafzimmer_gross
                      data:
                        position: 23

