    - parallel:
        - choose:
            - conditions:
                - condition: state
                  entity_id: person.samuel
                  state: home
                - condition: state
                  entity_id:
                    - input_boolean.leiser_modus
                    - input_boolean.gast_modus
                  state: "off"
              sequence:
