- id: remind_for_waste_collection
  alias: "Remind for waste collection"
  initial_state: true
  trigger:
    platform: time
    at: "16:00:00"
  condition:
    condition: and
    conditions:
      - condition: template
        value_template: "{{ (state_attr('sensor.nachste_abholungen', (now() + timedelta(days=1)).strftime('%Y-%m-%d')) != None) }}"
      #- condition: template
      #  value_template: "{{ as_timestamp(now()) - as_timestamp(states.automation.telegram_waste_put_outside.attributes.last_triggered) | int > 86400 }}"
  action:
    #- service: whatsapp.send_buttons
    - service: whatsapp.send_message
      data:
        target: !secret whatsapp_vermieter
        message: >
          {% set tomorrow = (now() + timedelta(days=1)).strftime('%Y-%m-%d') %}
          {% set pickup = state_attr('sensor.nachste_abholungen', tomorrow) %}

          {% if pickup is not none %}
            {% set weekdays = {'Monday': 'Montag', 'Tuesday': 'Dienstag', 'Wednesday': 'Mittwoch', 'Thursday': 'Donnerstag', 'Friday': 'Freitag', 'Saturday': 'Samstag', 'Sunday': 'Sonntag'} %}
            {% set day_name = weekdays[strptime(tomorrow, '%Y-%m-%d').strftime('%A')] %}
            {% set date_german = as_timestamp(tomorrow) | timestamp_custom('%d.%m.%Y') %}
            {% set verb = 'werden' if ',' in pickup or ' und ' in pickup else 'wird' %}
            {% set items = pickup | replace('Restmüll', '🗑️ *Restmüll*')
                                  | replace('Biotonne', '🌿 *Biotonne*')
                                  | replace('Gelber Sack', '♻️ *Gelber Sack*')
                                  | replace('Altpapier', '📄 *Altpapier*')
                                  | replace('Papiersamml', '📄 *Papiersammlung*')
                                  | replace('Problemmüll', '⚠️ *Problemmüll*')
                                  | replace('Gartenabfall', '🍂 *Gartenabfall*') %}
            📣 {{ day_name }}, {{ date_german }} (morgen) {{ verb }} {{ items }} abgeholt. Bitte rechtzeitig rausstellen! 🚛
          {% else %}
            Keine Abholung morgen.
          {% endif %}
        #buttons:
        #  - text: "✅ Erledigt"
        #    callback_data: "müll_erledigt"
        #  - text: "🗓️ Alle Abholungen"
        #    callback_data: "müllabholung"

- id: foodsharing_basket_notification
  alias: "Foodsharing: Basket Notification"
  initial_state: false
  trigger:
    - platform: state
      entity_id:
        - sensor.foodsharing_location_48_082236_11_854379_korbe # Zornd/Standard
        - sensor.foodsharing_location_48_117971_11_683341_korbe # MUC East
  condition:
    - condition: template
      # Automatisch: Nur wenn Korb-Anzahl steigt | Manuell: Immer erlaubt
      value_template: >
        {% if trigger.to_state is defined and trigger.from_state is defined %}
          {{ trigger.to_state.state | int(0) > trigger.from_state.state | int(0) }}
        {% else %}
          true
        {% endif %}
  action:
    - variables:
        config:
          - entity: sensor.foodsharing_location_48_082236_11_854379_korbe
            target: !secret telegram_foodsharing
            mobile_push: true
          - entity: sensor.foodsharing_location_48_117971_11_683341_korbe
            target: !secret telegram_foodsharing_muc
            mobile_push: false
    - repeat:
        for_each: "{{ config }}"
        sequence:
          - if:
              - condition: template
                value_template: >
                  {{ (trigger.entity_id is defined and trigger.entity_id == repeat.item.entity) or
                  (trigger.entity_id is not defined) }}
              - condition: template
                value_template: "{{ state_attr(repeat.item.entity, 'baskets') | length > 0 }}"
            then:
              - variables:
                  b: "{{ state_attr(repeat.item.entity, 'baskets')[0] }}"
                  clean_desc: "{{ b.description | trim | regex_replace('\\n\\s*\\n+', '\\n\\n') | e }}"
                  time_info: >
                    {% if b.available_until and b.available_until != 'Unknown' -%}
                    {% set dt = strptime(b.available_until, "%a %b %d %H:%M:%S %Y", None) -%}
                    ⏰ <b>Verfügbar bis ca.:</b> {{ dt.strftime('%d.%m. %H:%M') if dt else b.available_until | e }} Uhr
                    {%- endif %}
                  msg: |
                    🧺 <b>NEUER ESSENSKORB {% if b.user_name %}VON {{ b.user_name | upper | e }}{% endif %} VERFÜGBAR!</b>

                    {{ clean_desc }}

                    {{ time_info }}
                    ------------
                    🔗 <a href="https://foodsharing.de/essenskoerbe/{{ b.id }}">Korb auf Foodsharing.de</a>
                    ⚖️ <a href="https://wiki.foodsharing.network/wiki/Verhaltensregeln">Verhaltensregeln</a>

              - choose:
                  - conditions: "{{ b.picture is defined and b.picture not in [none, '', 'Unknown'] }}"
                    sequence:
                      - service: telegram_bot.send_photo
                        data:
                          target: "{{ repeat.item.target }}"
                          url: "{{ b.picture }}"
                          caption: "{{ msg }}"
                          parse_mode: html
                  - default:
                      - service: telegram_bot.send_message
                        data:
                          target: "{{ repeat.item.target }}"
                          message: "{{ msg }}"
                          parse_mode: html

              - if:
                  - condition: template
                    value_template: >
                      {{ repeat.item.mobile_push and 'Zorneding' in b.description and is_state('person.fabian', 'home') }}
                then:
                  - service: notify.mobile_app_pixel_10_pro
                    data:
                      title: "🧺 Neuer Korb in Zorneding"
                      message: "{% if b.user_name %}Von {{ b.user_name }}: {% endif %}{{ b.description | truncate(150) }}"
                      data:
                        image: "{{ b.picture if b.picture else '' }}"
                        clickAction: "https://foodsharing.de/essenskoerbe/{{ b.id }}"
                        push:
                          sound: { name: "default", critical: 1, volume: 0.4 }

