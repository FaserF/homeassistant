    from: "unavailable"
  condition:
    condition: and
    conditions:
      - condition: time
        after: "17:00:00"
        before: "00:00:00"
      - condition: template
        value_template: "{{ as_timestamp(now()) - as_timestamp(states.automation.remind_for_light_keller.attributes.last_triggered) | int > 12000 }}"
      - condition: or
        conditions:
          - condition: state
