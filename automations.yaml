- id: deckenlampe_button_hold
  alias: Deckenlampe Button Hold
  initial_state: true
  trigger:
    - platform: device
      domain: tasmota
      device_id: d75263b1d81c803aac073abd2257aa2d
      type: button_long_press
      subtype: button_1
      discovery_id: 68C63A87B4BF_button_1_HOLD
    - platform: event
      event_type: ios.action_fired
      event_data:
        actionName: "Light Livingroom"
  action:
    - choose:
        - conditions:
            - condition: or
              conditions:
                - condition: state
                  entity_id: switch.leds_wohnzimmer
                  state: "off"
                - condition: state
                  entity_id: switch.leds_wohnzimmer
                  state: "unavailable"
            - condition: or
              conditions:
                - condition: state
                  entity_id: light.stehlampe
                  state: "off"
                - condition: state
                  entity_id: light.stehlampe
                  state: "unavailable"
            - condition: or
              conditions:
                - condition: state
                  entity_id: light.fernseher_leds
                  state: "off"
                - condition: state
                  entity_id: light.fernseher_leds
                  state: "unavailable"
          sequence:
            #  - service: light.turn_off
            #    data:
            #      area_id: 7c05afe47efd44f5a0a064769ad6e105 # Wohnzimmer
            #      transition: 2
            #      brightness: 255
            - service: light.turn_on
              data:
                entity_id: light.stehlampe
                transition: 2
                brightness: 255
                color_temp: 225
            - service: light.turn_on
              data:
                entity_id: switch.leds_wohnzimmer
                transition: 2
                brightness: 255
                rgb_color: [255, 255, 255]
    - choose:
        - conditions:
            - condition: or
              conditions:
                - condition: state
                  entity_id: switch.leds_wohnzimmer
                  state: "on"
                  for:
                    seconds: 2
                - condition: state
                  entity_id: light.stehlampe
                  state: "on"
                  for:
                    seconds: 2
                - condition: state
                  entity_id: light.fernseher_leds
                  state: "on"
                  for:
                    seconds: 2
          sequence:
            - service: light.turn_off
              data:
                area_id: 7c05afe47efd44f5a0a064769ad6e105 # Wohnzimmer

