- id: warning_for_closed_doors
  alias: "Warning for closed doors"
  trigger:
    - platform: state
      entity_id: vacuum.valetudo_dreamez10pro
      to: "returning"
      for:
        minutes: 1
  condition:
    condition: and
    conditions:
      - condition: numeric_state
        entity_id: sensor.valetudo_dreamez10pro_current_statistics_area
        below: 220
      - condition: numeric_state
        entity_id: sensor.valetudo_dreamez10pro_current_statistics_area
        above: 10
      - condition: template
        value_template: "{{ as_timestamp(now()) - as_timestamp(states.automation.turn_on_vacuum_weekly.attributes.last_triggered) | int < 5400 }}"
  action:
    - choose:
        - conditions:
            - condition: numeric_state
              entity_id: sensor.smart_life_fabian_distance
              below: 70
          sequence:
            - service: telegram_bot.send_message
              data:
                chat_id: !secret telegram_chat_fabian
                message: "Anscheinend waren Türen bei der geplanten Reinigung geschlossen. Daher wurden nicht alle Räume gesaugt."

- id: trigger_a_full_dust_bin_reminder
  alias: "Trigger a full dust bin reminder"
  trigger:
    - platform: state
      entity_id: automation.trigger_a_full_dust_bin_reminder
      to: "on"
  action:
    - choose:
        - conditions:
            - condition: or
              conditions:
                - condition: numeric_state
                  entity_id: sensor.smart_life_samuel_distance
                  below: 10
                - condition: state
                  entity_id: person.samuel
                  state: "home"
          sequence:
            - service: telegram_bot.send_message
              data:
                message: "Der Staubbehälter des Staubsaugroboters könnte langsam voll sein und sollte geleert werden."
                chat_id: !secret telegram_chat_samuel
                inline_keyboard:
                  - "Erledigt:/telegramdustbindone"
    - choose:
        - conditions:
            - condition: or
              conditions:
                - condition: numeric_state
                  entity_id: sensor.smart_life_fabian_distance
                  below: 10
                - condition: state
                  entity_id: person.fabian
                  state: "home"
          sequence:
            - service: telegram_bot.send_message
              data:
                message: "Der Staubbehälter des Staubsaugroboters könnte langsam voll sein und sollte geleert werden."
                chat_id: !secret telegram_chat_fabian
                inline_keyboard:
                  - "Erledigt:/telegramdustbindone"

- id: vacuum_cleaner_counter
  alias: "Set Counter with Cleaner Runs and remind for emptying and refilling"
  trigger:
    - platform: state
      entity_id: vacuum.valetudo_dreamez10pro
      from: "docked"
      for:
        minutes: 2
  condition:
    condition: not
    conditions:
      - condition: state
        entity_id: vacuum.valetudo_dreamez10pro
        state: unavailable
      - condition: state
        entity_id: vacuum.valetudo_dreamez10pro
        state: idle
  action:
    - service: counter.decrement
      target:
        entity_id: counter.vacuum_water_level
    - choose:
        - conditions:
            - condition: state
              entity_id: select.valetudo_dreamez10pro_water_grade
              state: high
          sequence:
            - service: counter.decrement
              target:
                entity_id: counter.vacuum_water_level
    - choose:
        - conditions:
            - condition: numeric_state
              entity_id: counter.vacuum_water_level
              below: 1
          sequence:
            - choose:
                - conditions:
                    - condition: state
                      entity_id: person.samuel
                      state: home
                  sequence:
                    - service: telegram_bot.send_message
                      data:
                        chat_id: !secret telegram_chat_fabian
                        message: "Der Wassertank des Staubsaugroboters sollte zeitnah aufgefüllt werden."
            - choose:
                - conditions:
                    - condition: state
                      entity_id: person.fabian
                      state: home
                  sequence:
                    - service: telegram_bot.send_message
                      data:
                        chat_id: !secret telegram_chat_fabian
                        message: "Der Wassertank des Staubsaugroboters sollte zeitnah aufgefüllt werden."
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ states('counter.vacuum_runs')|float % 30 == 0 }}"
          sequence:
            - service: automation.trigger
              entity_id: automation.trigger_a_full_dust_bin_reminder
        - conditions:
            - condition: template
              value_template: "{{ states('counter.vacuum_runs')|float % 30 != 0 }}"
          sequence:
            - service: counter.increment
              target:
                entity_id: counter.vacuum_runs

- id: vacuum_water_refilled
  alias: "Vacuum Water refilled"
  trigger:
    - platform: state
      entity_id: binary_sensor.valetudo_dreamez10pro_water_tank_attachment
      from: "off"
      to: "on"
      for:
        seconds: 5
  condition:
    condition: not
    conditions:
      - condition: state
        entity_id: vacuum.valetudo_dreamez10pro
        state: unavailable
      - condition: numeric_state
        entity_id: counter.vacuum_water_level
        above: 90
  action:
    - service: counter.reset
      target:
        entity_id: counter.vacuum_water_level
    - choose:
        - conditions:
            - condition: not
              conditions:
                - condition: state
                  entity_id: person.samuel
                  state: "home"
          sequence:
            - service: telegram_bot.send_message
              data:
                chat_id: !secret telegram_chat_fabian
                message: "Der Wassertank des Staubsaugroboters wurde soeben aufgefüllt."
    - choose:
        - conditions:
            - condition: not
              conditions:
                - condition: state
                  entity_id: person.fabian
                  state: "home"
          sequence:
            - service: telegram_bot.send_message
              data:
                chat_id: !secret telegram_chat_fabian
                message: "Der Wassertank des Staubsaugroboters wurde soeben aufgefüllt."

- id: turn_off_staubsauger_after_x_hours
  alias: "Turn off staubsauger after x hours"
  initial_state: true
  trigger:
    - platform: state
      entity_id: vacuum.valetudo_dreamez10pro
      to: "on"
      for:
        minutes: 150
    - platform: state
      entity_id: vacuum.valetudo_dreamez10pro
      from: "off"
      to: "on"
      for:
        minutes: 360
  action:
    - service: switch.turn_off
      data:
        entity_id: vacuum.valetudo_dreamez10pro

- id: whatsapp_beer_bot
  alias: "WhatsApp Bot: Beer Keyword"
  trigger:
    - platform: event
      event_type: whatsapp_message_received
  condition:
    - condition: template
      value_template: >
        {{ 'beer' in trigger.event.data.content | lower or
          'cheers' in trigger.event.data.content | lower or
          'bier' in trigger.event.data.content | lower or
          'prost' in trigger.event.data.content | lower }}
  action:
    - service: whatsapp.send_reaction
      data:
        chat_id: "{{ trigger.event.data.sender }}"
        reaction: "🍺"
        message_id: "{{ trigger.event.data.raw.key.id }}"

- id: whatsapp_hype_bot
