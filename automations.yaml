                  {% else %}
                    {{ event_0['type'] != 'Spiel' }}
                  {% endif %}
                {% elif event_0 is not none %}
                  {{ event_0['type'] != 'Spiel' }}
                {% else %}
                  true
                {% endif %}
            - condition: template
              value_template: "{{ state_attr('sensor.kadermanager_zorro', 'events')[0]['type'] == 'Spiel' }}"
          sequence:
            - service: whatsapp.send_message
              continue_on_error: true
              data:
                target: !secret whatsapp_volleyball_tischabwischer
                message: >
                  {%- set event = state_attr('sensor.kadermanager_zorro', 'events')[0] %}
                  {%- set date = strptime(event['date'], '%Y-%m-%d') %}
                  {%- set weekday = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'][date.weekday()] %}
                  {% set schedule_text = "" %}
                  {% if states('sensor.dieliga_schedule_tsv_zorneding_ii') not in ['unknown', 'unavailable'] and state_attr('sensor.dieliga_schedule_tsv_zorneding_ii', 'total_games') %}
                    {%- set completed_games = (state_attr('sensor.dieliga_schedule_tsv_zorneding_ii', 'completed_games') | default(0)) + 1 %}
                    {%- set total_games = state_attr('sensor.dieliga_schedule_tsv_zorneding_ii', 'total_games') %}
                    {%- set schedule_text = '(' ~ completed_games ~ '. von ' ~ total_games ~ ')' %}
                  {% endif %}
                  {% set scoreboard_text = "" %}
                  {% if states('sensor.dieliga_scoreboard_tsv_zorneding_ii') not in ['unknown', 'unavailable'] %}
                    {%- set score = states('sensor.dieliga_scoreboard_tsv_zorneding_ii') | int(0) %}
                    {% if score > 0 and score <= 5 and state_attr('sensor.dieliga_scoreboard_tsv_zorneding_ii', 'teams') %}
                      {%- set teams_count = state_attr('sensor.dieliga_scoreboard_tsv_zorneding_ii', 'teams') | length %}
                      {%- set scoreboard_text = '\n📊 *Aktuelle Ligaplatzierung:* Platz ' ~ score ~ ' von ' ~ teams_count %}
                    {% endif %}
                  {% endif %}

                  *🏐 SPIELTAGS-ALARM! 🏐*

                  *Was:* {{ event['type'] }} {{ schedule_text }} "{{ event['title'] }}"

                  *Wann:* 📅 {{ weekday }}, {{ date.strftime('%d.%m.') }} um ⏰ {{ event['time'] }} Uhr

                  *Zusagen:* {{ event['in_count'] }}
                  {% set min_player = 6 if 'Heim' in event['title'] else 7 %}
                  {% if event['in_count'] < min_player %}


                  Auf geht's, wir brauchen noch Mitspieler! Bitte tragt euch zeitnah ein:
                  {{ event['link'] }}
                  {% else %}


                  Stimmt bitte zeitnah im Kadermanager ab:
                  {{ event['link'] }}
                  {% endif %}
                  {{ scoreboard_text }}
            - choose:
                - conditions:
                    - condition: template
                      value_template: >
                        {% set events = state_attr('sensor.kadermanager_zorro', 'events') %}
                        {% set ns = namespace(found=false) %}

                        {% if events is not none and events | length > 0 %}
                          {% set date0 = strptime(events[0].date, '%Y-%m-%d') %}

                          {# Bedingung A: Event 0 ist ein Dienstag #}
                          {% if date0.weekday() == 1 %}
                            {% set ns.found = true %}
                          {% endif %}

                          {# Bedingung B: Event 1 existiert, ist Di und 1 Tag nach Event 0 #}
                          {% if events | length > 1 %}
                            {% set date1 = strptime(events[1].date, '%Y-%m-%d') %}
                            {% if (date1.date() - date0.date()).days == 1 and date1.weekday() == 1 %}
                              {% set ns.found = true %}
                            {% endif %}
                          {% endif %}
                        {% endif %}

                        {{ ns.found }}
                  sequence:
                    - service: whatsapp.send_message
                      data:
                        target: !secret whatsapp_volleyball_group
                        message: >
                          *💡 Info:* Wegen des Spiels von Mannschaft 2 findet das kommende Training nur mit Mannschaft 3 statt.
                          {% set event = state_attr('sensor.kadermanager_zorro', 'events')[0] %}
                          {% if 'Heim' in event['title'] %}
                          Freiwillige Schiedsrichter sind herzlich willkommen!
                          {% endif %}

                          Bitte tragt euch dennoch für das Training ein, zum planen.
      default:
        - service: whatsapp.send_message
          data:
            target: !secret whatsapp_volleyball_tischabwischer
            message: >
              {%- set event = state_attr('sensor.kadermanager_zorro', 'events')[0] %}
              {%- set date = strptime(event['date'], '%Y-%m-%d') %}
              {%- set weekday = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'][date.weekday()] %}
              {%- set date_formatted = date.strftime('%d.%m.') %}
              {%- set in_count = event['in_count'] %}
              {%- set event_type = event['type'] %}
              {%- set event_title = event['title'] %}
              {%- set event_time = event['time'] %}
              {%- set event_link = event['link'] %}
              {% set messages = [
                "👋 *Kurze Erinnerung!*\n\n*Nächstes Event:*\n🏐 " ~ event_type ~ " \"" ~ event_title ~ "\"\n📅 " ~ weekday ~ ", " ~ date_formatted ~ " um ⏰ " ~ event_time ~ " Uhr\n\n*Aktueller Stand:* " ~ in_count ~ " Zusagen.\n\nHier geht's zur Abstimmung:\n" ~ event_link,
                "🏐 *Nicht vergessen: " ~ event_type ~ " am " ~ weekday ~ "!*\n\nAlle Infos im Überblick:\n*Was:* \"" ~ event_title ~ "\"\n*Wann:* " ~ date_formatted ~ " um " ~ event_time ~ " Uhr\n\nBisher sind wir " ~ in_count ~ " Leute.\n\nBitte hier abstimmen:\n" ~ event_link
              ] %}
              {{ messages | random }}

- id: remind_for_volleyball_by_kadermanager_low_participants
  alias: "Kadermanager Erinnerung bei zu wenigen Spielern (Mannschaft 2)"
  initial_state: true
  trigger:
    - platform: template
      value_template: >
        {% set events = state_attr('sensor.kadermanager_zorro', 'events') %}
        {% if events and events | length > 0 %}
          {% set event = events[0] %}
          {% set event_date = event['date'] %}
          {% set event_time = event['time'] %}
          {% set event_datetime = strptime(event_date + ' ' + event_time, '%Y-%m-%d %H:%M') %}
          {% set reminder_datetime = event_datetime - timedelta(days=2) %}
          {% set rounded_reminder_datetime = reminder_datetime.replace(minute=0, second=0, microsecond=0) + timedelta(hours=1 if reminder_datetime.minute >= 30 else 0) %}
          {% set now = now() %}
          {% set rounded_now = (now.replace(minute=0, second=0, microsecond=0) + timedelta(hours=1 if now.minute >= 30 else 0)).replace(tzinfo=None) %}
          {{ rounded_reminder_datetime == rounded_now }}
        {% else %}
          false
        {% endif %}
  condition:
    condition: and
    conditions:
      - condition: template
        value_template: >
          {% set events = state_attr('sensor.kadermanager_zorro', 'events') %}
          {{ events is not none and events | length > 0 and events[0]['type'] == 'Spiel' }}
      - condition: template
        value_template: >
          {% set events = state_attr('sensor.kadermanager_zorro', 'events') %}
          {{ events is not none and events | length > 0 and events[0]['in_count'] < 7 }}
  action:
    - service: whatsapp.send_message
      data:
        target: !secret whatsapp_volleyball_tischabwischer
        message: >
          *🚨 Spieler-Alarm für Mannschaft 2! 🚨*

          Für das Ligaspiel am
          {% set event = state_attr('sensor.kadermanager_zorro', 'events')[0] %}
          {%- set date = strptime(event['date'], '%Y-%m-%d') %}
          {%- set weekday = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'][date.weekday()] %}
          {{ weekday }} um ⏰ {{ event['time'] }} Uhr haben wir erst *{{ state_attr('sensor.kadermanager_zorro', 'events')[0]['in_count'] }}* Zusagen.

          {% set accepted_players = state_attr('sensor.kadermanager_zorro', 'events')[0]['players']['accepted_players'] %}
          {% if accepted_players %}
          *✅ Zugesagt haben:*
          {{ accepted_players | join(', ') }}
          {% endif %}

          {% set declined_players = state_attr('sensor.kadermanager_zorro', 'events')[0]['players']['declined_players'] %}
          {% if declined_players %}
          *❌ Abgesagt haben:*
          {{ declined_players | join(', ') }}
          {% endif %}

          Bitte tragt euch dringend ein, ansonsten müssen wir das Spiel verschieben:
          {{ event['link'] }}

- id: kadermanager_participant_count_reminder
  alias: "Kadermanager Teilnehmer-Erinnerung für Trainer"
  initial_state: true
  trigger:
    - platform: template
      value_template: >
        {% set events = state_attr('sensor.kadermanager_zorro', 'events') %}
        {% if events and events | length > 0 %}
          {% set event_date = events[0]['date'] %}
          {% set event_time = events[0]['time'] %}
          {% set event_datetime = strptime(event_date + ' ' + event_time, '%Y-%m-%d %H:%M') %}
          {% set reminder_datetime = event_datetime - timedelta(hours=3) %}
          {% set rounded_reminder_datetime = reminder_datetime.replace(minute=0, second=0, microsecond=0) + timedelta(hours=1 if reminder_datetime.minute >= 30 else 0) %}
          {% set now = now() %}
          {% set rounded_now = (now.replace(minute=0, second=0, microsecond=0) + timedelta(hours=1 if now.minute >= 30 else 0)).replace(tzinfo=None) %}
          {{ rounded_reminder_datetime == rounded_now }}
        {% else %}
          false
        {% endif %}
  condition:
    condition: and
    conditions:
      - condition: or
        conditions:
          - condition: and
            conditions:
              - condition: template
                value_template: "{{ state_attr('sensor.kadermanager_zorro', 'events')[0]['type'] == 'Training' }}"
              - condition: template
                value_template: "{{ strptime(state_attr('sensor.kadermanager_zorro', 'events')[0]['date'], '%Y-%m-%d').weekday() == 1 }}" #Tuesday
          - condition: template
            value_template: "{{ state_attr('sensor.kadermanager_zorro', 'events')[0]['type'] == 'Sonstiges' }}"
      - condition: template
        value_template: "{{ as_timestamp(now()) - as_timestamp(states.automation.remind_for_participant_count_on_kadermanager.attributes.last_triggered) | int(0) > 64800 }}"
  action:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ strptime(state_attr('sensor.kadermanager_zorro', 'events')[0]['date'], '%Y-%m-%d').weekday() == 1 }}"
          sequence:
            - service: whatsapp.send_message
              data:
                target: !secret whatsapp_volleyball_orga
                message: >
                  *🏐 Übersicht für heute:*
                  *Zusagen:* {{ state_attr('sensor.kadermanager_zorro', 'events')[0]['in_count'] }}

                  *✅ Dabei:*
                  {{ state_attr('sensor.kadermanager_zorro', 'events')[0]['players']['accepted_players'] | join(', ') }}

                  *❌ Nicht dabei:*
                  {{ state_attr('sensor.kadermanager_zorro', 'events')[0]['players']['declined_players'] | join(', ') }}

                  *Link:* {{ state_attr('sensor.kadermanager_zorro', 'events')[0]['link'] }}
    - choose:
        - conditions:
            - condition: template
              value_template: >
                {{ 'Fabian S' not in state_attr('sensor.kadermanager_zorro', 'events')[0]['players']['declined_players'] }}
            - condition: or
              conditions:
                - condition: numeric_state
                  entity_id: sensor.smart_life_fabian_distance
                  below: 40000
                - condition: state
                  entity_id: person.fabian
                  state: "home"
          sequence:
            - service: telegram_bot.send_message
              data:
                target: !secret telegram_chat_fabian
                message: >
                  *🏐 Übersicht für heute:* [Kadermanager]({{ state_attr('sensor.kadermanager_zorro', 'events')[0]['link'] }})
                  *Zusagen:* {{ state_attr('sensor.kadermanager_zorro', 'events')[0]['in_count'] }}

                  *✅ Dabei:* {{ state_attr('sensor.kadermanager_zorro', 'events')[0]['players']['accepted_players'] | join(', ') }}
                  *❌ Nicht dabei:* {{ state_attr('sensor.kadermanager_zorro', 'events')[0]['players']['declined_players'] | join(', ') }}

- id: open_covers_when_sunrise
  alias: "Open all covers when sun rise"
  trigger:
    - platform: sun
      event: sunrise
    - platform: time
      at: "08:00:00"
    - platform: time
      at: "11:00:00"
  condition:
    condition: and
    conditions:
      - condition: state
        entity_id: input_boolean.gast_modus
        state: "off"
      # - condition: or
      #  conditions:
      #    - condition: state
      #      entity_id: person.fabian
      #      state: home
      #    - condition: state
      #      entity_id: person.samuel
      #      state: home
      - condition: or
        conditions:
          - condition: and
            conditions:
              - condition: state
                entity_id: binary_sensor.workday_sensor
                state: "off"
              - condition: time
                after: "10:00:00"
                before: "16:30:00"
          - condition: and
            conditions:
              - condition: state
                entity_id: binary_sensor.workday_sensor
                state: "on"
              - condition: time
                after: "07:30:00"
                before: "16:30:00"
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.abwesend_modus
              state: "on"
          sequence:
            - service: cover.set_cover_position
              target:
                entity_id: all
              data:
                position: 30
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.abwesend_modus
              state: "off"
            - condition: state
              entity_id: device_tracker.fa
              state: "home"
            - condition: not
              conditions:
                - condition: state
                  entity_id: cover.schlafzimmer_gross
                  state: "open"
          sequence:
            - choose:
                - conditions:
                    - condition: numeric_state
                      entity_id: sensor.weather_ebersberg_hourly
                      above: 22
                    - condition: or
                      conditions:
                        - condition: template
                          value_template: "{{state_attr('sensor.weather_ebersberg_hourly', 'forecast')[0]['condition'] == 'sunny' }}"
                        - condition: template
                          value_template: "{{state_attr('sensor.weather_ebersberg_hourly', 'forecast')[0]['condition'] == 'partlycloudy' }}"
                  sequence:
                    - service: cover.set_cover_position
                      target:
                        entity_id:
                          - cover.schlafzimmer_gross
                      data:
                        position: 60
              default:
                - service: cover.set_cover_position
                  target:
                    entity_id: cover.schlafzimmer_gross
                  data:
                    position: 30
                - delay: "00:03:00"
                - service: cover.open_cover
                  target:
                    entity_id: cover.schlafzimmer_gross
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.abwesend_modus
              state: "off"
            - condition: state
              entity_id: input_boolean.gast_modus
              state: "off"
          sequence:
            - choose:
                - conditions:
                    - condition: numeric_state
                      entity_id: sensor.weather_ebersberg_hourly
                      above: 22
                    - condition: or
                      conditions:
                        - condition: template
                          value_template: "{{state_attr('sensor.weather_ebersberg_hourly', 'forecast')[0]['condition'] == 'sunny' }}"
                        - condition: template
                          value_template: "{{state_attr('sensor.weather_ebersberg_hourly', 'forecast')[0]['condition'] == 'partlycloudy' }}"
                  sequence:
                    - service: cover.set_cover_position
                      target:
                        entity_id:
                          - cover.wohnzimmer_rechts
                          - cover.wohnzimmer_links
                      data:
                        position: 60
              default:
                - service: cover.open_cover
                  target:
                    entity_id:
                      - cover.wohnzimmer_rechts
                      - cover.wohnzimmer_links
    - service: light.turn_off
      entity_id: all

- id: lower_covers_when_sunset
  alias: "lower all covers when sun set"
  trigger:
    platform: sun
    event: sunset
    offset: "00:15:00"
  action:
    - service: switch.turn_on
      data:
        entity_id: switch.schlafzimmer_steckerleiste_bett_bett_usb_ports
    - parallel:
        - choose:
            - conditions:
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: cover.wohnzimmer_rechts
                      state: "closed"
                    - condition: state
                      entity_id: cover.wohnzimmer_links
                      state: "closed"
              sequence:
                - service: cover.set_cover_position
                  target:
                    entity_id:
                      - cover.wohnzimmer_rechts
                      - cover.wohnzimmer_links
                  data:
                    position: 23
        - choose:
            - conditions:
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: cover.schlafzimmer_gross
                      state: "closed"
              sequence:
                - choose:
                    - conditions:
                        - condition: numeric_state
                          entity_id: sensor.weather_ebersberg_hourly
                          attribute: temperature
                          above: 20
                      sequence:
                        - service: cover.set_cover_position
                          target:
                            entity_id: cover.schlafzimmer_gross
                          data:
                            position: 45
                  default:
                    - service: cover.set_cover_position
                      target:
                        entity_id: cover.schlafzimmer_gross
                      data:
                        position: 33

- id: lower_covers_when_very_bright_outside
  alias: "lower all covers when very brigt outside"
  trigger:
    - platform: numeric_state
