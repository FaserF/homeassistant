- id: open_covers_when_darker_outside
  alias: "open all covers when darker outside"
  trigger:
    - platform: numeric_state
      entity_id: sensor.dwd_illuminance
      below: 20000
  condition:
    condition: and
    conditions:
      - condition: time
        after: "11:30:00"
        before: "17:30:00"
      - condition: state
        entity_id: input_boolean.abwesend_modus
        state: "off"
      - condition: numeric_state
        entity_id: sensor.dwd_illuminance
