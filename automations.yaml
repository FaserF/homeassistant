- id: turn_off_everything_if_nobody_is_at_home
  alias: "Turn off everything if nobody is at home"
  initial_state: true
  trigger:
    - platform: state
      entity_id: person.fabian
      from: "home"
      to: "not_home"
      for:
        minutes: 1
  condition:
    condition: not
    conditions:
      - condition: state
        entity_id: person.fabian
        state: home
  action:
    - service: light.turn_off
      target:
        entity_id: all
    - service: switch.turn_off
      data:
        entity_id:
          #- switch.schlafzimmer_steckerleiste_bett_bett_usb_ports
          - switch.fernseher
          - switch.lautsprecher
    - service: media_player.turn_off
      data:
        entity_id: all
    - choose:
        - conditions:
            - condition: state
              entity_id: device_tracker.fabian_pc_lan_fabian_pc_lan
              state: "home"
            - condition: state
              entity_id: switch.fabian_schreibtisch
              state: 'on'
          sequence:
            - service: notify.telegram_fabian
              data:
                message: "Keiner ist mehr zu Hause! Fabian-PC ist allerdings noch an!"
                data:
                  inline_keyboard:
                    - "Herunterfahren:/shutdownfpc, Ruhezustand:/hibernatefpc"
    - choose:
        - conditions:
            - condition: state
              entity_id: device_tracker.fabian_pc_lan_fabian_pc_lan
              state: "not_home"
          sequence:
            - service: input_boolean.turn_off
              data:
                entity_id: input_boolean.fabian_pc_strom
    - delay: "00:30:00"
    - choose:
        - conditions:
            - condition: not
              conditions:
                - condition: state
                  entity_id: person.fabian
                  state: home
            - condition: state
              entity_id: input_boolean.gast_modus
              state: "off"
            - condition: or
              conditions:
                - condition: template
                  value_template: "{{state_attr('sensor.weather_ebersberg_daily', 'forecast')[0]['temperature'] | int <= 10 }}"
                - condition: template
                  value_template: "{{state_attr('sensor.weather_ebersberg_daily', 'forecast')[0]['temperature'] | int >= 28 }}"
          sequence:
            - service: cover.close_cover
              target:
                entity_id: all

- id: Automations if coming home
  alias: "Automations if coming home"
  initial_state: true
  trigger:
    - platform: state
      entity_id: person.fabian
      from: "not_home"
      to: "home"
    - platform: state
      entity_id: person.samuel
      from: "not_home"
      to: "home"
  #condition:
  #  condition: template
  #  value_template: "{{ trigger.from_state.last_changed > utcnow() - timedelta(minutes=4) }}"
  action:
    - service: input_boolean.turn_off
      data:
        entity_id: input_boolean.abwesend_modus
    - service: automation.trigger
      entity_id: automation.set_climate_at_night
    - choose:
        - conditions:
            - condition: sun
              after: sunset
            - condition: time
              before: "23:59:00"
            - condition: or
              conditions:
                - condition: or
                  conditions:
                    - condition: time
                      after: "22:00:00"
                    - condition: state
                      entity_id: binary_sensor.workday_sensor
                      state: "off"
                - condition: state
                  entity_id: binary_sensor.workday_sensor
                  state: "on"
          sequence:
            #- choose:
            #    - conditions:
            #        - condition: state
            #          entity_id: person.samuel
            #          state: "home"
            #        - condition: template
            #          value_template: "{{ (as_timestamp(now()) - as_timestamp(states.person.samuel.last_changed) | int < 240) }}"
            #      sequence:
            #        - service: light.turn_on
            #          data:
            #            entity_id: light.lampe_samuel
            - choose:
                - conditions:
                    - condition: state
                      entity_id: person.fabian
                      state: "home"
                    - condition: template
                      value_template: "{{ (as_timestamp(now()) - as_timestamp(states.person.fabian.last_changed) | int < 240) }}"
                  sequence:
                    - service: light.turn_on
                      data:
                        entity_id: light.yeelink_bslamp2_22e2_light
    - choose:
        - conditions:
            - condition: sun
              before: sunset
            - condition: sun
              after: sunrise
            - condition: or
              conditions:
                - condition: and
                  conditions:
                    - condition: time
                      after: "07:30:00"
                    - condition: state
                      entity_id: binary_sensor.workday_sensor
                      state: "on"
                - condition: and
                  conditions:
                    - condition: time
                      after: "11:00:00"
                    - condition: state
                      entity_id: binary_sensor.workday_sensor
                      state: "off"
          sequence:
            - choose:
                - conditions:
                    - condition: numeric_state
                      entity_id: sensor.weather_ebersberg_hourly
                      attribute: temperature
                      above: 22
                  sequence:
                    - service: cover.set_cover_position
                      target:
                        entity_id: all
                      data:
                        position: 70
              default:
                - service: cover.open_cover
                  target:
                    entity_id: all
    - choose:
        - conditions:
            - condition: not
              conditions:
                - condition: state
                  entity_id: person.samuel
                  state: "home"
            - condition: numeric_state
              entity_id: sensor.smart_life_samuel_distance
              below: 100
            - condition: state
              entity_id: person.fabian
              state: "home"
            - condition: template
              value_template: "{{ (as_timestamp(now()) - as_timestamp(states.person.fabian.last_changed) | int < 240) }}"
            - condition: template
              value_template: "{{ as_timestamp(now()) - as_timestamp(states.automation.telegram_send_daily_weather_forecast_fabian.attributes.last_triggered) | int > 3600 }}"
          sequence:
            - service: notify.telegram_fabian
              data:
                message: "Welcome back. Samuel ist nicht daheim."
    - choose:
        - conditions:
            - condition: numeric_state
              entity_id: counter.vacuum_water_level
              below: 1
          sequence:
            - choose:
                - conditions:
                    - condition: state
                      entity_id: person.fabian
                      state: home
                    - condition: template
                      value_template: "{{ (as_timestamp(now()) - as_timestamp(states.person.fabian.last_changed) | int < 240) }}"
                  sequence:
                    - service: notify.telegram_fabian
                      data:
                        message: "Der Wassertank des Staubsaugroboters sollte zeitnah aufgefüllt werden."
            - choose:
                - conditions:
                    - condition: state
                      entity_id: person.samuel
                      state: home
                    - condition: template
                      value_template: "{{ (as_timestamp(now()) - as_timestamp(states.person.samuel.last_changed) | int < 240) }}"
                  sequence:
                    - service: notify.telegram_fabian
                      data:
                        message: "Der Wassertank des Staubsaugroboters sollte zeitnah aufgefüllt werden."
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ as_timestamp(states.automation.trigger_a_full_dust_bin_reminder.attributes.last_triggered) > as_timestamp(states.automation.telegram_dust_bin_emptied.attributes.last_triggered) }}"
          sequence:
            - choose:
                - conditions:
                    - condition: state
                      entity_id: person.fabian
                      state: home
                    - condition: template
                      value_template: "{{ (as_timestamp(now()) - as_timestamp(states.person.fabian.last_changed) | int < 240) }}"
                  sequence:
                    - service: telegram_bot.send_message
                      data:
