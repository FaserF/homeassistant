- id: whatsapp_waste_bot
  alias: "WhatsApp Bot: Waste Collection"
  trigger:
    - platform: event
      event_type: whatsapp_message_received
  condition:
    - condition: template
      value_template: "{{ 'müllabholung' in trigger.event.data.content | lower or 'abfallabholung' in trigger.event.data.content | lower }}"
  action:
    - service: whatsapp.send_message
      data:
        target: "{{ trigger.event.data.sender }}"
        message: >
          ♻️ *Abfallkalender:*

          - 🚛 *Nächste Abholungen in Zorneding:*
            {%- set attributes = states.sensor.nachste_abholungen.attributes %}
            {%- set dates = attributes.keys() | select('match', '^\\d{4}-\\d{2}-\\d{2}$') | sort %}
            {%- set weekdays = {'Monday': 'Montag', 'Tuesday': 'Dienstag', 'Wednesday': 'Mittwoch', 'Thursday': 'Donnerstag', 'Friday': 'Freitag', 'Saturday': 'Samstag', 'Sunday': 'Sonntag'} %}
            {%- for date in dates[:5] %}
            {%- set pickup = attributes[date] %}
            {%- set delta = ((as_timestamp(date) - as_timestamp(now().strftime('%Y-%m-%d'))) / 86400) | int %}
            {%- set day_name = weekdays[strptime(date, '%Y-%m-%d').strftime('%A')] %}
            {%- set date_german = as_timestamp(date) | timestamp_custom('%d.%m.%Y') %}
            {%- set items = pickup | replace('Restmüll', '🗑️ *Restmüll*')
                                  | replace('Biotonne', '🌿 *Biotonne*')
                                  | replace('Gelber Sack', '♻️ *Gelber Sack*')
                                  | replace('Altpapier', '📄 *Altpapier*')
                                  | replace('Papiersamml', '📄 *Papiersammlung*')
                                  | replace('Problemmüll', '⚠️ *Problemmüll*')
                                  | replace('Gartenabfall', '🍂 *Gartenabfall*') %}
            {%- if delta == 0 %}
            * 📅 **Heute, {{ day_name }} ({{ date_german }})**: {{ items }}
            {%- elif delta == 1 %}
            * 📅 **Morgen, {{ day_name }} ({{ date_german }})**: {{ items }}
            {%- elif delta < 7 %}
            * 📅 **{{ day_name }}, in {{ delta }} Tagen ({{ date_german }})**: {{ items }}
            {%- else %}
            * 📅 **{{ day_name }}, {{ date_german }}**: {{ items }}
            {%- endif %}
            {%- endfor %}

- id: whatsapp_wurstserver_reminder
  alias: "Wurstserver: Erinnerung vor Deadline"
  description: "Sendet eine übersichtliche Erinnerung vor Ablauf der Bestellfrist."
  trigger:
    # 1. Trigger: Regulär 11 Stunden vor der erfassten Deadline
    - platform: template
      value_template: >
        {% set deadline = states('sensor.wurstserver_deadline') | as_datetime %}
        {{ deadline is not none and now() >= deadline - timedelta(hours=11) }}
    # 2. Trigger: Donnerstag um 13:00 Uhr, wenn die Deadline ungültig/unbekannt ist
    - platform: template
      value_template: >
        {% set deadline_raw = states('sensor.wurstserver_deadline') %}
        {% set deadline = deadline_raw | as_datetime %}
        {% set is_invalid = deadline_raw in ['unavailable', 'unknown'] or deadline is none %}
        {{ is_invalid and now().weekday() == 3 and now().hour == 13 and now().minute == 0 }}
  condition:
    # Verhindert Mehrfach-Triggerung innerhalb von 24 Stunden (86300 Sekunden)
    - condition: template
      value_template: >
        {% set last_triggered = state_attr('automation.whatsapp_wurstserver_reminder', 'last_triggered') %}
        {{ last_triggered is none or as_timestamp(now()) - as_timestamp(last_triggered) > 86300 }}
  action:
    - service: whatsapp.send_message
      data:
        target: !secret whatsapp_wurstlrunde
        message: >
          {% set deadline = states('sensor.wurstserver_deadline') | as_datetime %}
          🌭 Bitte denkt noch an's Feedback für die nächste Würschtlrunde vor {{ deadline.strftime('%d.%m. %H:%M') if deadline is not none else 'Donnerstag 24:00 Uhr' }}


          *✅ ZUSAGEN: ({{ states('sensor.wurstserver_zusagen') }} Personen)*

          {% set entries = state_attr('sensor.wurstserver_ubersicht', 'entries') %}
          {% for entry in entries if entry.status == 'zusage' -%}
          • {{ entry.name }}: *{{ entry.detailed_order | default(entry.order_count ~ ' Stück') }}*{% if entry.remark %} (_{{ entry.remark }}_){% endif %}

          {% endfor %}

          *❌ ABSAGEN: ({{ states('sensor.wurstserver_absagen') }} Personen)*

          {% for entry in entries if entry.status == 'absage' -%}
          • {{ entry.name }}{% if entry.remark %} (_{{ entry.remark }}_){% endif %}

          {% endfor %}

          ---

          🔗 https://www.wurstserver.de

