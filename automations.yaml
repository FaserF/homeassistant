- id: turn_on_fridge_for_meetings
  alias: "Turn on fridge for meetings"
  initial_state: true
  trigger:
    - platform: template
      value_template: "{{ as_timestamp(now()) | round(-1) == (as_timestamp(states.calendar.votgaming_kalender.attributes.start_time) - 10800) | round(-1) }}"
  condition:
    condition: and
    conditions:
      - condition: template
        value_template: "{{ ((as_timestamp(states.calendar.votgaming_kalender.attributes.start_time) - as_timestamp(now())) < 43200) and ((as_timestamp(states.calendar.votgaming_kalender.attributes.start_time) - as_timestamp(now())) > 0) }}"
      - condition: not
        conditions:
          - condition: state
            entity_id: calendar.votgaming_kalender
            attribute: message
            state: "Gruppentreffen"
  action:
    - choose:
        - conditions:
            - condition: and
              conditions:
                - condition: state
                  entity_id: calendar.votgaming_kalender
                  attribute: message
                  state: "Gruppentreffen"
                - condition: state
                  entity_id: "switch.drucker"
                  state: "off"
            - condition: or
              conditions:
                - condition: template
                  value_template: "{{ now().month < 4 and now().month > 10 }}"
                - condition: and
                  conditions:
                    - condition: template
                      value_template: "{{ now().month <= 10 and now().month >= 4 }}"
                    - condition: numeric_state
                      entity_id: sensor.weather_ebersberg_hourly
                      attribute: temperature
                      below: 6
          sequence:
            - service: telegram_bot.send_message
              data:
                chat_id: !secret telegram_chat_5friends
                message: "Erinnerung: Heute steht {{ states.calendar.votgaming_kalender.attributes.message }} an."
                disable_notification: true
                inline_keyboard:
                  - "Kühlschrank anschalten:/fridge"
    - choose:
        - conditions:
            - condition: and
              conditions:
                - condition: state
                  entity_id: calendar.votgaming_kalender
                  attribute: message
                  state: "Gruppentreffen"
                - condition: state
                  entity_id: input_boolean.abwesend_modus
                  state: "off"
                - condition: state
                  entity_id: "switch.drucker"
                  state: "off"
                - condition: template
                  value_template: "{{ now().month <= 10 and now().month >= 4 }}" #  Im Winter ist der Keller kalt genug, da muss der Kühlschrank nicht an sein.
                - condition: numeric_state
                  entity_id: sensor.weather_ebersberg_hourly
                  attribute: temperature
                  above: 5
          sequence:
            - service: telegram_bot.send_message
              data:
                chat_id: !secret telegram_chat_5friends
                message: "Anscheinend steht heute {{ states.calendar.votgaming_kalender.attributes.message }} an, soll der Kühlschrank im Keller eingeschaltet werden?"
                disable_notification: true
                inline_keyboard:
                  - "Anschalten:/fridge"
    - choose:
        - conditions:
            - condition: state
              entity_id: "switch.drucker"
              state: "off"
            - condition: template
              value_template: "{{ now().month <= 10 and now().month >= 4 }}" #  Im Winter ist der Keller kalt genug, da muss der Kühlschrank nicht an sein.
            - condition: state
              entity_id: input_boolean.abwesend_modus
              state: "off"
            - condition: not
              conditions:
                - condition: state
                  entity_id: calendar.votgaming_kalender
                  attribute: message
                  state: "Gruppentreffen"
            - condition: or
              conditions:
                - condition: state
                  entity_id: calendar.votgaming_kalender
                  attribute: location
                  state: !secret strasse
                - condition: state
                  entity_id: calendar.votgaming_kalender
                  attribute: location
                  state: none
                - condition: state
                  entity_id: calendar.votgaming_kalender
                  attribute: location
                  state: ""
            - condition: or
              conditions:
                - condition: state
                  entity_id: calendar.votgaming_kalender
                  attribute: message
                  state: "Treffen"
                - condition: state
                  entity_id: calendar.votgaming_kalender
                  attribute: message
                  state: "Monthly Meet"
                - condition: state
                  entity_id: calendar.votgaming_kalender
                  attribute: message
                  state: "Treffen in Zorneding"
                - condition: state
                  entity_id: calendar.votgaming_kalender
                  attribute: message
                  state: "Geburtstagsfeier"
                - condition: state
                  entity_id: calendar.votgaming_kalender
                  attribute: message
                  state: "Spieleabend"
                - condition: state
                  entity_id: calendar.votgaming_kalender
                  attribute: message
                  state: "Karten- / Brettspieleabend"
                - condition: state
                  entity_id: calendar.votgaming_kalender
                  attribute: message
                  state: "Brettspieltreff"
                - condition: state
                  entity_id: calendar.votgaming_kalender
                  attribute: message
                  state: "Kartenspieleabend"
          sequence:
            - service: telegram_bot.send_message
              data:
                chat_id: !secret telegram_chat_fabian
                message: "Anscheinend steht heute {{ states.calendar.votgaming_kalender.attributes.message }} an, soll der Kühlschrank im Keller eingeschaltet werden?"
                disable_notification: true
                inline_keyboard:
                  - "Anschalten:/fridge"

