          1. {{ days_ost[0].day }} ({{ days_ost[0].value }}% / Tag: {{ days_ost[0].day_avg }}%)
          2. {{ days_ost[1].day }} ({{ days_ost[1].value }}% / Tag: {{ days_ost[1].day_avg }}%)
          3. {{ days_ost[2].day }} ({{ days_ost[2].value }}% / Tag: {{ days_ost[2].day_avg }}%)

