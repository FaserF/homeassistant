- id: turn_off_climates_on_warm_days
  alias: "Turn off Climates on warm days"
  initial_state: true
  trigger:
    platform: numeric_state
    entity_id: sensor.weather_ebersberg_hourly
    attribute: temperature
    above: 14
  condition:
    condition: and
    conditions:
      - condition: template
        value_template: "{{ state_attr('sensor.weather_ebersberg_daily', 'forecast')[0]['condition'] == 'sunny' }}"
      - condition: template
        value_template: "{{ state_attr('sensor.weather_ebersberg_daily', 'forecast')[1]['condition'] == 'sunny' }}"
      - condition: template
        value_template: "{{ state_attr('sensor.weather_ebersberg_daily', 'forecast')[1]['temperature'] >= 14 }}"
      - condition: state
        entity_id: "input_boolean.thermostate_aus"
        state: "off"
      - condition: or
        conditions:
          - condition: template
            value_template: "{{ now().month <= 10 and now().month >= 2 }}"
  action:
    - service: input_boolean.turn_on
      data:
        entity_id: input_boolean.thermostate_aus
    - service: telegram_bot.send_message
      data:
        chat_id: !secret telegram_chat_fabian
        message: "Thermostate wurden ausgeschaltet, da es {{ states.weather.ebersberg_ebersberg.attributes.temperature }}° hat und sonnig ist."
        disable_notification: true
        inline_keyboard:
          - "Einschalten:/climateson"
    - service: telegram_bot.send_message
      data:
        chat_id: !secret telegram_chat_samuel_dummy
        message: "Thermostate wurden ausgeschaltet, da es {{ states.weather.ebersberg_ebersberg.attributes.temperature }}° hat und sonnig ist."
        disable_notification: true
        inline_keyboard:
          - "Einschalten:/climateson"

- id: turn_on_climates_on_cold_days
  alias: "Turn on Climates on cold days"
  initial_state: true
  trigger:
    - platform: numeric_state
      entity_id: sensor.weather_ebersberg_hourly
      attribute: temperature
      below: 10
    - platform: sun
      event: sunset
  condition:
    condition: and
    conditions:
      - condition: state
        entity_id: "input_boolean.thermostate_aus"
        state: "on"
      - condition: template
        value_template: "{{ as_timestamp(now()) - as_timestamp(states.automation.turn_on_climates_on_cold_days.attributes.last_triggered) | int > 86300 }}"
      - condition: or
        conditions:
          - condition: and
            conditions:
              - condition: numeric_state
                entity_id: sensor.weather_ebersberg_hourly
                attribute: temperature
                below: 10
              - condition: sun
                after: sunset
                after_offset: "-04:00:00"
              - condition: time
                after: "20:30:00"
              - condition: template
                value_template: "{{ now().month <= 10 and now().month >= 2 }}"
          - condition: template
            value_template: "{{ state_attr('sensor.weather_ebersberg_daily', 'forecast')[1]['temperature'] <= 12 }}"
          - condition: and
            conditions:
              - condition: template
                value_template: "{{ state_attr('sensor.weather_ebersberg_daily', 'forecast')[1]['condition'] != 'sunny' }}"
              - condition: template
                value_template: "{{ state_attr('sensor.weather_ebersberg_daily', 'forecast')[1]['temperature'] <= 14 }}"
  action:
    - service: telegram_bot.send_message
      data:
        chat_id: !secret telegram_chat_fabian
        message: "Thermostate sollten wieder eingeschaltet werden, da es jetzt nur noch {{ states.weather.ebersberg_ebersberg.attributes.temperature }} °C und morgen {{ state_attr('sensor.weather_ebersberg_daily', 'forecast')[1]['temperature'] }} °C hat. Dies wurde nicht automatisch gemacht!"
        disable_notification: true
        inline_keyboard:
          - "Einschalten:/climateson"
    - service: telegram_bot.send_message
      data:
        chat_id: !secret telegram_chat_samuel_dummy
        message: "Thermostate sollten wieder eingeschaltet werden, da es jetzt nur noch {{ states.weather.ebersberg_ebersberg.attributes.temperature }} °C und morgen {{ state_attr('sensor.weather_ebersberg_daily', 'forecast')[1]['temperature'] }} °C hat. Dies wurde nicht automatisch gemacht!"
        disable_notification: true
        inline_keyboard:
          - "Einschalten:/climateson"

- id: remind_for_gruppentreffen
  alias: "Gruppentreffen Reminder (3 Days Before)"
  description: "Sends a Telegram poll 3 days before a Gruppentreffen event"

  trigger:
    # Trigger exactly 72 hours (3 days) before the event start
    - platform: calendar
      event: start
      offset: "-72:00:00"
      entity_id: calendar.votgaming_kalender
  condition:
    - condition: or
      conditions:
        - condition: template
          value_template: "{{ trigger is not defined }}" # Allow manual trigger
        - condition: template
          value_template: "{{ trigger.calendar_event.summary == 'Gruppentreffen' }}"
  action:
    - variables:
        # Robust way to get event data: Try trigger first, then fall back to calendar state
        event_data: >
          {% if trigger is defined and trigger.calendar_event is defined %}
            {{ trigger.calendar_event }}
          {% else %}
            {{ {
              'start': state_attr('calendar.votgaming_kalender', 'start_time'),
              'summary': state_attr('calendar.votgaming_kalender', 'message')
            } }}
          {% endif %}
        # Calculate weekday from the extracted start time
        event_weekday: >
          {% set days = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"] %}
          {% if event_data.start %}
            {{ days[as_datetime(event_data.start).weekday()] }}
          {% else %}
            Event-Tag
          {% endif %}
        forecast_data: "{{ state_attr('sensor.weather_ebersberg_daily', 'forecast') }}"
        # Logic to find the best forecast index based on days remaining
        target_forecast: >
          {% if event_data.start %}
            {% set days_diff = ((as_timestamp(event_data.start) - as_timestamp(now())) / 86400) | int %}
            {% if forecast_data and days_diff >= 0 and forecast_data | length > days_diff %}
              {{ forecast_data[days_diff] }}
            {% else %}
              {{ none }}
            {% endif %}
          {% else %}
            {{ none }}
          {% endif %}
    - choose:
        # Case 1: Good weather predicted
        - conditions:
            - condition: template
              value_template: >
                {{ target_forecast is not none and
                (target_forecast.condition in ['sunny', 'partlycloudy']) and
                (target_forecast.temperature | int >= 18) }}
          sequence:
            - service: telegram_bot.send_poll
              data:
                chat_id: !secret telegram_chat_5friends
                question: >
                  {% set greetings = ["Aufgepasst!", "Wohoo!", "Termin-Check!"] %}
                  {{ greetings | random }} Am {{ event_weekday }} steht unser {{ event_data.summary }} an!
                  Das Wetter wird super: {{ target_forecast.condition }} bei {{ target_forecast.temperature }}°C.
                  {% if now().month <= 4 or now().month >= 10 %}Die Sonne scheint bis ⏰ {{ state_attr('sun.sun', 'next_dusk') | as_timestamp | timestamp_custom('%H:%M', false) }}.{% endif %}
                  Wo treffen wir uns? ☀️
                options:
                  - "See 🌊"
                  - "Weiher"
                  - "Fabi"
                  - "Kai & Adri"
                  - "Flo"
                  - "Maxi"
                  - "Bar (z.B. Tropic Bar) 🍹"
                  - "Wo anders (Schreiben!)"
                is_anonymous: false
                allows_multiple_answers: true
                disable_notification: true
        # Case 2: Weather sensor unavailable or unknown
        - conditions:
            - condition: or
              conditions:
                - "{{ states('sensor.weather_ebersberg_daily') in ['unavailable', 'unknown'] }}"
                - "{{ target_forecast is none }}"
          sequence:
            - service: telegram_bot.send_poll
              data:
                chat_id: !secret telegram_chat_5friends
                question: >
                  {% set greetings = ["Obacht!", "Aufgepasst!", "Servus!"] %}
                  {{ greetings | random }} Am {{ event_weekday }} ist wieder {{ event_data.summary }}!
                  Wettervorhersage ist gerade nicht verfügbar.
                  Wo schlagen wir unser Lager auf?
                options:
                  - "Fabi"
                  - "Kai & Adri"
                  - "Flo"
                  - "Maxi"
