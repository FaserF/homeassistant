- id: turn_off_light_at_night_notify
  alias: "Turn off light at night - notify"
  initial_state: true
  trigger:
    platform: time
    at: "00:30:00"
  condition:
    - condition: state
      entity_id: input_boolean.gast_modus
      state: "off"
    - condition: state
      entity_id: binary_sensor.workday_sensor
      state: "on"
    - condition: template
      value_template: >
        {% set domain = 'light' %}
        {% set state = 'on' %}
        {{ states[domain] | selectattr('state','eq', state) | list | count > 0 }}
  action:
    - choose:
        - conditions:
            - condition: not
              conditions:
                - condition: state
                  entity_id: media_player.schlafzimmer_tv
                  state: "unavailable"
            - condition: template
              value_template: >
                {% set domain = 'light' %}
                {% set state = 'on' %}
                {{ states[domain] | selectattr('state','eq', state) | list | count > 1 }}
          sequence:
            - choose:
                - conditions:
                    - condition: or
                      conditions:
                        - condition: state
                          entity_id: person.fabian
                          state: "home"
                  sequence:
                    - service: telegram_bot.send_message
                      data:
                        chat_id: !secret telegram_chat_fabian
                        message: >
                          Es sind noch nachfolgende Lichter an, diese werden in 20 Minuten ausgeschaltet, außer im Keller:

                          {% set lights_on = states.light | selectattr('state', 'eq', 'on') | map(attribute='name') | list %}

                          {% for light in lights_on %}
                            - {{ light }}
                          {% endfor %}
                        inline_keyboard:
                          - "Abbruch:/cancellight, Okay:/telegramno"
            - choose:
                - conditions:
                    - condition: or
                      conditions:
                        - condition: state
                          entity_id: person.samuel
                          state: "home"
                  sequence:
                    - service: telegram_bot.send_message
                      data:
                        chat_id: !secret telegram_chat_samuel_dummy
                        message: >
                          Es sind noch nachfolgende Lichter an, diese werden in 20 Minuten ausgeschaltet, außer im Keller:

                          {% set lights_on = states.light | selectattr('state', 'eq', 'on') | map(attribute='name') | list %}

                          {% for light in lights_on %}
                            - {{ light }}
                          {% endfor %}
                        inline_keyboard:
                          - "Abbruch:/cancellight, Okay:/telegramno"
      default:
        - service: telegram_bot.send_message
          data:
            chat_id: !secret telegram_chat_fabian
            message: >
              Es sind noch nachfolgende Lichter an, diese werden in 20 Minuten ausgeschaltet, außer im Keller:

              {% set lights_on = states.light | selectattr('state', 'eq', 'on') | map(attribute='name') | list %}

              {% for light in lights_on %}
                - {{ light }}
              {% endfor %}
            inline_keyboard:
              - "Abbruch:/cancellight, Okay:/telegramno"
        - service: telegram_bot.send_message
          data:
            chat_id: !secret telegram_chat_samuel_dummy
            message: >
              Es sind noch nachfolgende Lichter an, diese werden in 20 Minuten ausgeschaltet, außer im Keller:

              {% set lights_on = states.light | selectattr('state', 'eq', 'on') | map(attribute='name') | list %}

              {% for light in lights_on %}
                - {{ light }}
              {% endfor %}
            inline_keyboard:
              - "Abbruch:/cancellight, Okay:/telegramno"

- id: turn_off_light_at_night
  alias: "Turn off light at night"
  initial_state: true
  trigger:
    platform: time
    at: "00:50:00"
  condition:
    - condition: template
      value_template: >
        {% set domain = 'light' %}
        {% set state = 'on' %}
        {{ states[domain] | selectattr('state','eq', state) | list | count > 0 }}
    - condition: template
      value_template: "{{ as_timestamp(now()) - as_timestamp(states.automation.telegram_answer_cancel_light_turn_off.attributes.last_triggered) | int > 1500 }}"
    - condition: template
      value_template: "{{ as_timestamp(now()) - as_timestamp(states.automation.turn_off_light_at_night_notify.attributes.last_triggered) | int < 1800 }}"
  action:
    - choose:
        - conditions:
            - condition: template
              value_template: >
                {% set domain = 'light' %}
                {% set state = 'on' %}
                {{ states[domain] | selectattr('state','eq', state) | list | count > 1 }}
            - condition: not
              conditions:
                - condition: state
                  entity_id: media_player.schlafzimmer_tv
                  state: "unavailable"
          sequence:
            - service: light.turn_off
              data:
                area_id:
                  - wohnzimmer # Wohnzimmer
                  - schlafzimmer # Fabians Zimmer
                  - schlafzimmer # Samuels Zimmer
            - choose:
                - conditions:
                    - condition: or
                      conditions:
                        - condition: state
                          entity_id: person.fabian
                          state: "home"
                        - condition: numeric_state
                          entity_id: sensor.smart_life_fabian_distance
                          below: 100
                  sequence:
                    - service: telegram_bot.send_message
                      data:
                        chat_id: !secret telegram_chat_fabian
                        message: "Alle Lichter (außer im Keller) wurden automatisch ausgeschaltet, da diese vermutlich vergessen wurden."
      default:
        - service: light.turn_off
          data:
            area_id:
              - wohnzimmer # Wohnzimmer
              - schlafzimmer # Fabians Zimmer
              - schlafzimmer # Samuels Zimmer
        - choose:
            - conditions:
                - condition: or
                  conditions:
                    - condition: state
                      entity_id: person.fabian
                      state: "home"
                    - condition: numeric_state
                      entity_id: sensor.smart_life_fabian_distance
                      below: 100
              sequence:
                - service: telegram_bot.send_message
                  data:
                    chat_id: !secret telegram_chat_fabian
                    message: "Alle Lichter wurden automatisch ausgeschaltet, da diese vermutlich vergessen wurden."

- id: turn_off_devices_at_night_notify
  alias: "Turn off devices at night - notify"
  initial_state: true
  trigger:
    platform: time
    at: "03:30:00"
  condition:
    - condition: state
      entity_id: binary_sensor.workday_sensor
      state: "off"
    - condition: or
      conditions:
        - condition: state
          entity_id: switch.fernseher
          state: "on"
        #- condition: state
        #  entity_id: switch.drucker
        #  state: "on"
        - condition: state
          entity_id: switch.fernseher_schlafzimmer
          state: "on"
        - condition: template
          value_template: >
            {% set domain = 'light' %}
            {% set state = 'on' %}
            {{ states[domain] | selectattr('state','eq', state) | list | count > 0 }}
  action:
    - choose:
        - conditions:
            - condition: or
              conditions:
                - condition: numeric_state
                  entity_id: sensor.smart_life_fabian_distance
                  below: 100
                - condition: state
                  entity_id: person.fabian
                  state: "home"
          sequence:
            - service: telegram_bot.send_message
              data:
                chat_id: !secret telegram_chat_fabian
                message: >
                  Es sind noch nachfolgende Geräte an, diese werden in 20 Minuten ausgeschaltet, außer im Keller:

                  {% set lights_on = states.light | selectattr('state', 'eq', 'on') | map(attribute='name') | list %}
                  {% set switches_on = states.switch | selectattr('state', 'eq', 'on') | selectattr('entity_id', 'in', ['switch.fernseher', 'switch.fernseher']) | map(attribute='name') | list %}

                  {% for light in lights_on %}
                    - {{ light }}
                  {% endfor %}

                  {% for switch in switches_on %}
                    - {{ switch }} ist eingeschaltet
                  {% endfor %}
                inline_keyboard:
                  - "Abbruch:/cancellight, Okay:/telegramno"

    - choose:
        - conditions:
            - condition: or
              conditions:
                - condition: numeric_state
                  entity_id: sensor.smart_life_samuel_distance
                  below: 5
                - condition: state
                  entity_id: person.samuel
                  state: "home"
          sequence:
            - service: telegram_bot.send_message
              data:
                chat_id: !secret telegram_chat_samuel_dummy
                message: >
                  Es sind noch nachfolgende Geräte an, diese werden in 20 Minuten ausgeschaltet, außer im Keller:

                  {% set lights_on = states.light | selectattr('state', 'eq', 'on') | map(attribute='name') | list %}
                  {% set switches_on = states.switch | selectattr('state', 'eq', 'on') | selectattr('entity_id', 'in', ['switch.fernseher', 'switch.fernseher']) | map(attribute='name') | list %}

                  {% for light in lights_on %}
                    - {{ light }}
                  {% endfor %}

                  {% for switch in switches_on %}
                    - {{ switch }} ist eingeschaltet
                  {% endfor %}
                inline_keyboard:
                  - "Abbruch:/cancellight, Okay:/telegramno"

- id: turn_off_devices_at_night
  alias: "Turn off devices at night"
  initial_state: true
  trigger:
    platform: time
    at: "04:50:00"
  action:
    - choose:
        - conditions:
            - condition: or
              conditions:
                - condition: state
                  entity_id: switch.fernseher
                  state: "on"
                #- condition: state
                #  entity_id: switch.drucker
                #  state: "on"
                - condition: state
                  entity_id: switch.fernseher_schlafzimmer
                  state: "on"
                - condition: template
                  value_template: >
                    {% set domain = 'light' %}
                    {% set state = 'on' %}
                    {{ states[domain] | selectattr('state','eq', state) | list | count > 0 }}
            - condition: template
              value_template: "{{ as_timestamp(now()) - as_timestamp(states.automation.telegram_answer_cancel_light_turn_off.attributes.last_triggered) | int > 1500 }}"
            - condition: template
              value_template: "{{ as_timestamp(now()) - as_timestamp(states.automation.turn_off_devices_at_night_notify.attributes.last_triggered) | int < 1800 }}"
          sequence:
            - service: switch.turn_off
              entity_id:
                - switch.fernseher
                #- switch.drucker
                - switch.fernseher_schlafzimmer
            - service: light.turn_off
              entity_id: all
            - service: media_player.turn_off
              entity_id: media_player.schlafzimmer_tv
            - choose:
                - conditions:
                    - condition: or
                      conditions:
                        - condition: numeric_state
                          entity_id: sensor.smart_life_fabian_distance
                          below: 100
                        - condition: state
                          entity_id: person.fabian
                          state: "home"
                  sequence:
                    - service: telegram_bot.send_message
                      data:
                        chat_id: !secret telegram_chat_fabian
                        message: "Fernseher & Lichter wurden automatisch ausgeschaltet, da diese vermutlich vergessen wurden."
            - choose:
                - conditions:
                    - condition: or
                      conditions:
                        - condition: numeric_state
                          entity_id: sensor.smart_life_samuel_distance
                          below: 100
                        - condition: state
                          entity_id: person.samuel
                          state: "home"
                  sequence:
                    - service: telegram_bot.send_message
                      data:
                        chat_id: !secret telegram_chat_samuel_dummy
                        message: "Fernseher & Lichter wurden automatisch ausgeschaltet, da diese vermutlich vergessen wurden."
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ as_timestamp(now()) - as_timestamp(states.sensor.zorneding_departures_via_starnberg_nord.last_updated) | int > 16400 }}"
          sequence:
            - choose:
                - conditions:
                    - condition: state
                      entity_id: update.home_assistant_core_update
                      state: "on"
                  sequence:
                    - service: telegram_bot.send_message
                      data:
                        chat_id: !secret telegram_chat_fabian
                        message: >
                          Home Assistant {{ states.update.home_assistant_core_update.attributes.latest_version }} wird nun installiert um HA neuzustarten, da DB API Verbindung verloren wurde.

                          Changelog HA: {{ states.update.home_assistant_core_update.attributes.release_url }}
                    - service: update.install
                      data:
                        entity_id: update.home_assistant_core_update
              default:
                - service: telegram_bot.send_message
                  data:
                    chat_id: !secret telegram_chat_fabian
                    message: "Starte Homeassistant neu, da DB API Verbindung verloren wurde."
                - service: homeassistant.restart

- id: remind_for_unavailable_device
  alias: "Remind for unavailable device"
  initial_state: false
  mode: single
  trigger:
    platform: time
    at: "17:10:00"
  condition:
    - condition: template
      value_template: >
        {% set relevant_domains = ['switch', 'light', 'input_button', 'climate'] %}
        {% set excluded = ['light.stehlampe', 'light.stehlampe_schlafzimmer', 'switch.fernseher', 'light.prismatik'] %}
        {% set unavailable_devices = states | selectattr('domain', 'in', relevant_domains)
          | selectattr('state', 'eq', 'unavailable')
          | rejectattr('entity_id', 'in', excluded)
          | list %}
        {{ unavailable_devices | length > 0 }}
    - condition: template
      value_template: >
        {% set last_triggered = states.automation.remind_for_unavailable_device.attributes.last_triggered %}
        {{ not last_triggered or (now() - as_datetime(last_triggered)).total_seconds() > 3200 }}
  action:
    - variables:
        excluded:
          [
            "light.stehlampe",
            "light.stehlampe_schlafzimmer",
            "switch.fernseher",
            "light.prismatik",
          ]
        unavailable_devices: >
          {{ states | selectattr('domain', 'in', relevant_domains)
            | selectattr('state', 'eq', 'unavailable')
            | rejectattr('entity_id', 'in', excluded)
            | map(attribute='entity_id') | list }}
    - service: telegram_bot.send_message
      data:
        chat_id: !secret telegram_chat_fabian
        disable_notification: true
        message: >
          {{ unavailable_devices | length }} Geräte sind nicht erreichbar, bitte prüfen:

          {{ unavailable_devices | join(', ') }}

- id: activate_guest_mode_if_guest_is_here
  alias: "Activate guest mode if guest is here"
  initial_state: false
  trigger:
    - platform: time
      at: "01:00:00"
  condition:
    condition: and
    conditions:
      - condition: state
        entity_id: input_boolean.gast_modus
        state: "off"
      - condition: template
        value_template: "{{ as_timestamp(now()) - as_timestamp(states.automation.activate_guest_mode_if_guest_is_here.attributes.last_triggered) | int > 86400 }}"
      - condition: or
        conditions:
          - condition: state
            entity_id: person.adri
            state: "home"
          - condition: state
            entity_id: person.kai
            state: "home"
          - condition: state
            entity_id: person.fabio
            state: "home"
  action:
    - service: input_boolean.turn_on
      data:
        entity_id: input_boolean.gast_modus
    - service: telegram_bot.send_message
      data:
        chat_id: !secret telegram_chat_fabian
        message: "Gast Modus wuremand vermutlich übernachtet. Automationen in Samuels Zimmer sind dadurch eingeschränkt."
    - service: telegram_bot.send_message
      data:
        chat_id: !secret telegram_chat_samuel_dummy
        message: "Gast Modus wurde aktiviert, da jemand vermutlich übernachtet. Automationen in Samuels Zimmer sind dadurch eingeschränkt."

- id: deactivate_guest_mode_if_no_guest_is_here
  alias: "Deactivate guest mode if no guest is here"
  initial_state: true
  trigger:
    - platform: state
      entity_id: input_boolean.gast_modus
      to: "on"
      for:
        days: 1
  condition:
    condition: and
    conditions:
      - condition: state
        entity_id: input_boolean.gast_modus
        state: "on"
      - condition: not
        conditions:
          - condition: state
            entity_id: person.adri
            state: "home"
          - condition: state
            entity_id: person.kai
            state: "home"
          - condition: state
            entity_id: person.fabio
            state: "home"
  action:
    - service: input_boolean.turn_off
      data:
        entity_id: input_boolean.gast_modus
    - service: telegram_bot.send_message
      data:
        chat_id: !secret telegram_chat_fabian
        message: "Gast Modus wurde deaktiviert, da niemand mehr zu Besuch ist."

- id: reactivate_adguard_protection
  alias: "Reactivate Adguard Protection"
  initial_state: true
  trigger:
    - platform: state
      entity_id: switch.adguard_protection
      to: "off"
      for:
        hours: 12
    - platform: state
      entity_id: switch.adguard_filtering
      to: "off"
      for:
        hours: 12
  action:
    - service: switch.turn_on
      data:
        entity_id: switch.adguard_protection
    - service: switch.turn_on
      data:
        entity_id: switch.adguard_filtering
    # - service: telegram_bot.send_message
    #   data_template:
    #     chat_id: !secret telegram_chat_fabian
    #     message: "Adguard wurde wieder eingeschaltet."

- id: deactivate_silent_mode_after_12_hours
  alias: "Deactivate silent mode after 12 hours"
  initial_state: true
  trigger:
    - platform: state
      entity_id: input_boolean.leiser_modus
      to: "on"
      for:
        hours: 12
